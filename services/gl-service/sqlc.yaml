version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema/schema.sql"      # sqlc catalog (plain DDL; no RLS/partition/trigger)
    queries: "db/queries"
    gen:
      go:
        package: "gldb"
        out: "internal/gldb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
