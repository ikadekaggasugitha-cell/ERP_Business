name: erp-slice

x-service-base: &service-base
  restart: unless-stopped
  environment:
    DATABASE_MAX_OPEN_CONNS: "5"
  depends_on:
    seeds:
      condition: service_completed_successfully
    broker:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 15
    start_period: 5s

x-migrate-depends: &migrate-depends
  bootstrap:
    condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    container_name: erp-slice-db-1
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20

  broker:
    image: redpandadata/redpanda:v24.2.7
    container_name: erp-slice-broker-1
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://broker:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://broker:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - broker:33145
      - --advertise-rpc-addr
      - broker:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --default-log-level=warn
    ports:
      - "9092:9092"
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:\\s*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 5s

  bootstrap:
    image: postgres:16-alpine
    container_name: erp-slice-bootstrap-1
    environment:
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ERP_APP_USER: ${ERP_APP_USER:-erp_app}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:-app}
    volumes:
      - ./deploy/bootstrap.sh:/bootstrap.sh:ro
      - ./db/ops:/ops:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate-gl:
    image: migrate/migrate:v4.18.1
    volumes: ["./db/migrations/gl_db:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/gl_db?sslmode=disable", "up"]
    depends_on: *migrate-depends
    restart: "no"

  migrate-ap:
