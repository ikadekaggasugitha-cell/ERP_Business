name: go-services-ci

on:
  push:
    paths: ["services/**", "db/migrations/**", ".github/workflows/go-ci.yml"]
  pull_request:
    paths: ["services/**", "db/migrations/**"]

jobs:
  shared-and-gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [shared, api-gateway]
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.module }}/go.sum
      - name: Vet and race-test
        run: |
          go vet ./...
          go test -race ./...

  microservices:
    runs-on: ubuntu-latest
    needs: [shared-and-gateway]
    strategy:
      fail-fast: false
      matrix:
        service:
          - gl-service
          - ap-service
          - audit-service
          - ar-service
          - coa-service
          - tax-service
          - treasury-cashbank-service
          - user-service
          - security-service
          - masterdata-service
          - org-service
          - workflow-service
          - procurement-service
          - inventory-service
          - manufacturing-service
          - sales-service
          - hr-service
          - payroll-service
          - reporting-service
          - currency-service
          - dimension-service
          - localization-service
          - fixedasset-service
          - budget-service
          - financialclose-service
          - consolidation-service
          - project-service
          - asset-service
          - maintenance-service
          - crm-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Verify sqlc diff, vet, and race-test
        run: |
          sqlc diff
          go vet ./...
          go test -race ./...

