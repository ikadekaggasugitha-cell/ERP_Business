name: db-regression

on:
  push:
    paths: ["db/migrations/**", "db/ops/**", "db/tests/**", "db/seeds/**", "deploy/seeds.sh", "src/data_modules/custom/**", ".github/workflows/db-regression.yml"]
  pull_request:
    paths: ["db/migrations/**", "db/ops/**", "db/tests/**", "db/seeds/**", "deploy/seeds.sh", "src/data_modules/custom/**", ".github/workflows/db-regression.yml"]

jobs:
  dataform-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: src/data_modules/custom/pnpm-lock.yaml
      - name: Install Dataform dependencies and compile offline
        working-directory: src/data_modules/custom
        run: |
          pnpm install --frozen-lockfile
          ./node_modules/.bin/dataform compile

  sql-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGURL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Create databases
        run: |
          psql "$PGURL/postgres" -c "CREATE DATABASE gl_db"
          psql "$PGURL/postgres" -c "CREATE DATABASE org_db"

      - name: Migrate gl_db
        run: migrate -path db/migrations/gl_db -database "$PGURL/gl_db?sslmode=disable" up

      - name: Migrate org_db
        run: migrate -path db/migrations/org_db -database "$PGURL/org_db?sslmode=disable" up

      - name: Regression — document number uniqueness (gl_db)
        run: psql "$PGURL/gl_db?sslmode=disable" -f db/tests/document_number_uniqueness.sql

      - name: Regression — RLS isolation (gl_db)
        run: psql "$PGURL/gl_db?sslmode=disable" -f db/tests/rls_regression.sql

      - name: Regression — optimistic locking (org_db)
        run: psql "$PGURL/org_db?sslmode=disable" -f db/tests/optimistic_lock_regression.sql

  rls-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGURL: postgres://postgres:postgres@localhost:5432
    strategy:
      fail-fast: false
      matrix:
        db:
          - ap_db
          - ar_db
          - asset_db
          - audit_db
          - budget_db
          - coa_db
          - consolidation_db
          - crm_db
          - currency_db
          - dimension_db
          - financialclose_db
          - fixedasset_db
          - gl_db
          - hr_db
          - inventory_db
          - localization_db
          - maintenance_db
          - manufacturing_db
          - masterdata_db
          - org_db
          - payroll_db
          - procurement_db
          - project_db
          - reporting_db
          - sales_db
          - security_db
          - tax_db
          - treasury_db
          - user_db
          - workflow_db
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Create, migrate, and apply grants on ${{ matrix.db }}
        run: |
          psql "$PGURL/postgres" -f db/ops/roles.sql
          psql "$PGURL/postgres" -c "CREATE DATABASE ${{ matrix.db }}"
          migrate -path db/migrations/${{ matrix.db }} -database "$PGURL/${{ matrix.db }}?sslmode=disable" up
          psql "$PGURL/${{ matrix.db }}?sslmode=disable" -f db/ops/apply_grants.sql

      - name: Seed reference data + tenant fixtures (live smoke checks B/C/D)
        run: |
          if [ -f "db/seeds/${{ matrix.db }}/seed.sql" ]; then
            psql "$PGURL/${{ matrix.db }}?sslmode=disable" -f "db/seeds/${{ matrix.db }}/seed.sql"
            psql "$PGURL/${{ matrix.db }}?sslmode=disable" -v org_id='11111111-1111-1111-1111-111111111111' -f "db/seeds/${{ matrix.db }}/seed.sql"
          fi
          psql "$PGURL/${{ matrix.db }}?sslmode=disable" -v db=${{ matrix.db }} -f db/tests/rls_smoke_tenants.sql

      - name: RLS smoke (${{ matrix.db }})
        run: psql "$PGURL/${{ matrix.db }}?sslmode=disable" -f db/tests/rls_smoke.sql

  service-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGURL: postgres://postgres:postgres@localhost:5432
    strategy:
      fail-fast: false
      matrix:
        db:
          - ap_db
          - ar_db
          - asset_db
          - audit_db
          - budget_db
          - coa_db
          - consolidation_db
          - crm_db
          - currency_db
          - dimension_db
          - financialclose_db
          - fixedasset_db
          - gl_db
          - hr_db
          - inventory_db
          - localization_db
          - maintenance_db
          - manufacturing_db
          - masterdata_db
          - org_db
          - payroll_db
          - procurement_db
          - project_db
          - reporting_db
          - sales_db
          - security_db
          - tax_db
          - treasury_db
          - user_db
          - workflow_db
    steps:
      - uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/

      - name: Migrate up & down (${{ matrix.db }})
        run: |
          psql "$PGURL/postgres" -c "CREATE DATABASE ${{ matrix.db }}"
          migrate -path db/migrations/${{ matrix.db }} -database "$PGURL/${{ matrix.db }}?sslmode=disable" up
          migrate -path db/migrations/${{ matrix.db }} -database "$PGURL/${{ matrix.db }}?sslmode=disable" down -all
