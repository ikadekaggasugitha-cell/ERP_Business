apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp-staging

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: erp-platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: erp-staging
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Cluster
      group: postgresql.cnpg.io
      version: v1
      name: erp-postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/size
        value: 50Gi
  - target:
      kind: KafkaNodePool
      group: kafka.strimzi.io
      version: v1beta2
      name: erp-kafka-dual-role
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
