    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-payroll-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-procurement-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-project-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-reporting-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-sales-service
