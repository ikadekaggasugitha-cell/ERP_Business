    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-fixedasset-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-gl-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-hr-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-inventory-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-localization-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-maintenance-service
