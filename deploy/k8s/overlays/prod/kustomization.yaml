  - name: ghcr.io/sinergiinvestasiproperti/erp-user-service
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-web-spa
    newTag: "0.0.0-unset"
  - name: ghcr.io/sinergiinvestasiproperti/erp-workflow-service
    newTag: "0.0.0-unset"

patches:
  - target:
      kind: Namespace
      name: erp-platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: erp-prod
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: gl-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: reporting-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: audit-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
