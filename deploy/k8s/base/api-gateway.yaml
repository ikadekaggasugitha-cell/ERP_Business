---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-platform
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: erp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: erp-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/sinergiinvestasiproperti/erp-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: HTTP_ADDR
              value: ":8000"
            - name: DEV_AUTH_MODE
              value: "false"
            - name: DEV_AUTH_ALLOW_ANON
              value: "false"
            - name: KAFKA_BROKERS
              value: "erp-kafka-kafka-bootstrap.erp-platform.svc.cluster.local:9093"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.REPLACE_ME_DOMAIN"
            - name: CORS_ALLOW_CHROME_EXTENSIONS
              value: "false"
            - name: GATEWAY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: GATEWAY_HMAC_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: JWT_SECRET
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: OIDC_ISSUER_URL
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: OIDC_AUDIENCE
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: REDIS_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: erp-platform
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: erp-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: erp-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
