  namespace: erp-platform
  labels:
    app.kubernetes.io/name: project-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: erp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: project-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: erp-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-service
          image: ghcr.io/sinergiinvestasiproperti/erp-project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: HTTP_ADDR
              value: ":8080"
            - name: REQUIRE_RBAC
              value: "true"
            - name: DATABASE_MAX_OPEN_CONNS
              value: "5"
            - name: ERP_APP_USER
              valueFrom:
                secretKeyRef:
                  name: erp-db-app-secret
                  key: ERP_APP_USER
            - name: ERP_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-db-app-secret
                  key: ERP_APP_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(ERP_APP_USER):$(ERP_APP_PASSWORD)@erp-postgres-pooler-rw.erp-platform.svc.cluster.local:5432/project_db?sslmode=require"
            - name: KAFKA_BROKERS
              value: "erp-kafka-kafka-bootstrap.erp-platform.svc.cluster.local:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: GATEWAY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: erp-platform-secrets
                  key: GATEWAY_HMAC_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: erp-platform
  labels:
    app.kubernetes.io/name: project-service
    app.kubernetes.io/component: microservice
spec:
  selector:
    app.kubernetes.io/name: project-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-service
  namespace: erp-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: project-service
  namespace: erp-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-service
---
