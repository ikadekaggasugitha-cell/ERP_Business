---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-spa
  namespace: erp-platform
  labels:
    app.kubernetes.io/name: web-spa
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: erp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-spa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-spa
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: erp-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-spa
          image: ghcr.io/sinergiinvestasiproperti/erp-web-spa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-spa
  namespace: erp-platform
  labels:
    app.kubernetes.io/name: web-spa
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: web-spa
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-spa
  namespace: erp-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-spa
