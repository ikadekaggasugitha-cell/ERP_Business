---
# ClusterSecretStore connecting External Secrets Operator to HashiCorp Vault (KV v2)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "erp-platform-eso"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: erp-platform
---
# Shared platform & gateway secrets (HMAC trust, JWT, OIDC, Redis)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-platform-secrets
  namespace: erp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erp-platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: GATEWAY_HMAC_SECRET
      remoteRef:
        key: erp/platform
        property: gateway_hmac_secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: erp/platform
        property: jwt_secret
    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: erp/platform
        property: oidc_issuer_url
    - secretKey: OIDC_AUDIENCE
      remoteRef:
        key: erp/platform
        property: oidc_audience
    - secretKey: REDIS_URL
      remoteRef:
        key: erp/platform
        property: redis_url
---
# PostgreSQL application credentials (non-owner erp_app member of erp_app_rw)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-db-app-secret
  namespace: erp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erp-db-app-secret
    creationPolicy: Owner
  data:
    - secretKey: ERP_APP_USER
      remoteRef:
        key: erp/database
        property: app_user
    - secretKey: ERP_APP_PASSWORD
      remoteRef:
        key: erp/database
        property: app_password
---
# PII AES-256-GCM keyring for hr-service and payroll-service (supports key rotation)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: erp-pii-secrets
  namespace: erp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: erp-pii-secrets
    creationPolicy: Owner
  data:
    - secretKey: PII_ENCRYPTION_KEY
      remoteRef:
        key: erp/pii
        property: active_key_hex
    - secretKey: PII_ENCRYPTION_KEY_PREVIOUS
      remoteRef:
        key: erp/pii
        property: previous_key_hex
